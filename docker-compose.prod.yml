# Production compose for Digital Ocean
# Domain: ragu.pragmata.cloud
# Uses existing Traefik from /opt/infra (traefik-public network)
#
# Usage:
#   cp .env.production .env   # edit passwords
#   docker compose -f docker-compose.prod.yml up -d

networks:
  traefik-public:
    external: true
  ragu-internal:
    driver: bridge

services:

  # ─── Frontend (React + Nginx) ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ragu-web
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - traefik-public
      - ragu-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ragu.rule=Host(`ragu.pragmata.cloud`)"
      - "traefik.http.routers.ragu.entrypoints=websecure"
      - "traefik.http.routers.ragu.tls.certresolver=letsencrypt"
      - "traefik.http.services.ragu.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"

  # ─── API Gateway (Hono + Bun) ──────────────────────────────────
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: ragu-gateway
    environment:
      PORT: "3000"
      OLLAMA_SERVICE_URL: http://ragu-ollama:11434
      RAG_SERVICE_URL: http://ragu-rag:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ragu-internal

  # ─── RAG Backend (FastAPI + Python) ────────────────────────────
  rag:
    build:
      context: ./services/rag
      dockerfile: Dockerfile
    container_name: ragu-rag
    environment:
      VECTOR_DB: ${VECTOR_DB:-hybrid}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-ragu}:${POSTGRES_PASSWORD:-ragu_local}@ragu-postgres:5432/${POSTGRES_DB:-ragu}
      QDRANT_URL: http://ragu-qdrant:6333
      REDIS_URL: redis://ragu-redis:6379/0
      MINIO_ENDPOINT: ragu-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ragu}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ragu_local_s3}
      OLLAMA_HOST: http://ragu-ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ragu-internal

  # ─── Ollama (LLM Runtime) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ragu-ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ragu-internal

  # ─── Data Stores ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragu_local}
      POSTGRES_DB: ${POSTGRES_DB:-ragu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/rag/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragu}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ragu-internal

  minio:
    image: minio/minio:latest
    container_name: ragu-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ragu}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ragu_local_s3}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ragu-internal

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragu-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ragu-internal

  redis:
    image: redis:7-alpine
    container_name: ragu-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ragu-internal

volumes:
  postgres-data:
  minio-data:
  qdrant-data:
  redis-data:
  ollama-data:
